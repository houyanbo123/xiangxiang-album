<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>将将的成长相册 - 母亲节特别版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* 开场动画 */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        
        .intro-text {
            font-size: 3rem;
            color: #fff;
            opacity: 0;
            animation: fadeInOut 4s ease-in-out forwards;
            text-align: center;
            padding: 20px;
            font-weight: 300;
            letter-spacing: 5px;
        }
        
        .intro-subtext {
            font-size: 1.5rem;
            color: #FFB6C1;
            opacity: 0;
            animation: fadeIn 2s ease-in-out 4s forwards;
            text-align: center;
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 3px;
        }
        
        .enter-btn {
            margin-top: 50px;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: transparent;
            border: 1px solid #FFB6C1;
            color: #FFB6C1;
            border-radius: 30px;
            cursor: pointer;
            opacity: 0;
            animation: fadeIn 2s ease-in-out 6s forwards;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        
        .enter-btn:hover {
            background: #FFB6C1;
            color: #0a0a0a;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.2); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* 主界面 */
        #main {
            display: none;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            text-align: center;
            border-bottom: 1px solid rgba(255, 182, 193, 0.2);
        }
        
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(45deg, #FFB6C1, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 300;
            letter-spacing: 3px;
        }
        
        .theme-nav {
            position: fixed;
            left: 0;
            top: 80px;
            bottom: 0;
            width: 220px;
            padding: 20px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            overflow-y: auto;
            z-index: 99;
            border-right: 1px solid rgba(255, 182, 193, 0.1);
        }
        
        .theme-item {
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .theme-item:hover {
            background: rgba(255, 182, 193, 0.1);
            border-color: rgba(255, 182, 193, 0.3);
        }
        
        .theme-item.active {
            background: rgba(255, 182, 193, 0.15);
            border-color: #FFB6C1;
        }
        
        .theme-icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }
        
        .theme-name {
            font-size: 1rem;
            color: #fff;
            font-weight: 300;
        }
        
        .theme-count {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }
        
        /* 照片墙 */
        .photo-wall {
            margin-left: 220px;
            margin-top: 80px;
            padding: 30px;
            column-count: 3;
            column-gap: 20px;
        }
        
        @media (max-width: 1024px) {
            .photo-wall {
                column-count: 2;
            }
        }
        
        @media (max-width: 768px) {
            .theme-nav {
                display: none;
            }
            .photo-wall {
                margin-left: 0;
                column-count: 2;
                padding: 15px;
            }
        }
        
        .photo-item {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: #1a1a1a;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .photo-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 182, 193, 0.2);
        }
        
        .photo-item img {
            width: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .photo-item:hover img {
            transform: scale(1.08);
        }
        
        .photo-theme {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: #fff;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        /* 主题分隔 */
        .theme-separator {
            column-span: all;
            text-align: center;
            padding: 60px 20px;
            margin: 40px 0;
        }
        
        .theme-separator h2 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #FFB6C1, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 15px;
        }
        
        .theme-separator p {
            color: #888;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        /* 照片查看器 */
        #viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        #viewer.show {
            display: flex;
        }
        
        #viewer img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
            animation: zoomIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .viewer-close {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            z-index: 2001;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .viewer-close:hover {
            background: rgba(255, 182, 193, 0.3);
            transform: rotate(90deg);
        }
        
        .viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            color: #fff;
            cursor: pointer;
            padding: 20px;
            z-index: 2001;
            user-select: none;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .viewer-nav:hover {
            background: rgba(255, 182, 193, 0.2);
        }
        
        .viewer-prev {
            left: 30px;
        }
        
        .viewer-next {
            right: 30px;
        }
        
        .viewer-info {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-size: 1.1rem;
            z-index: 2001;
            font-weight: 300;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <!-- 开场动画 -->
    <div id="intro" onclick="enterAlbum()">
        <div class="intro-text">将将的成长相册</div>
        <div class="intro-subtext">每一个瞬间，都是永恒的记忆</div>
        <button class="enter-btn" onclick="event.stopPropagation(); enterAlbum();">开启记忆之旅</button>

    <!-- 主界面 -->
    <div id="main">

            <h1>&#10084;&#65039; 将将的成长相册 &#10084;&#65039;</h1>

        <div class="theme-nav" id="themeNav"></div>
        
        <div class="photo-wall" id="photoWall"></div>

    <!-- 照片查看器 -->
    <div id="viewer" onclick="closeViewer()">

        <div class="viewer-nav viewer-next" onclick="event.stopPropagation(); navigateViewer(1);">&#10095;</div>
        <img id="viewerImg" src="" alt="" onclick="event.stopPropagation();">
        <div class="viewer-info" id="viewerInfo"></div>
    </div>

4-26-470982.jpg", "name": "日常点滴", "icon": "&#128247;"}, {"theme": "daily", "filename": "2026-04-26-511571.jpg", "path": "photos/daily/2026-04-26-511571.jpg", "name": "日常点滴", "icon": "&#128247;"}, {"theme": "daily", "filename": "2026-04-26-525397.jpg", "path": "photos/daily/2026-04-26-525397.jpg", "name": "日常点滴", "icon": "&#128247;"}]};
        
        let currentTheme = null;
        let currentPhotoIndex = 0;
        
        function init() {
            const themeNav = document.getElementById('themeNav');
            const themes = Object.keys(PHOTOS_BY_THEME);
            
            themes.forEach(function(theme) {
                const photos = PHOTOS_BY_THEME[theme];
                const themeItem = document.createElement('div');
                themeItem.className = 'theme-item';
                themeItem.dataset.theme = theme;
                themeItem.innerHTML = '<div><span class="theme-icon">' + photos[0].icon + '</span><span class="theme-name">' + photos[0].name + '</span></div><div class="theme-count">' + photos.length + ' 张照片</div>';
                themeItem.onclick = function() { filterByTheme(theme); };
                themeNav.appendChild(themeItem);
            });
            
            showAllPhotos();
        }
        
        function showAllPhotos() {
            const photoWall = document.getElementById('photoWall');
            photoWall.innerHTML = '';
            
            const themes = Object.keys(PHOTOS_BY_THEME);
            themes.forEach(function(theme) {
                const photos = PHOTOS_BY_THEME[theme];
                
                const separator = document.createElement('div');
                separator.className = 'theme-separator';
                separator.innerHTML = '<h2>' + photos[0].icon + ' ' + photos[0].name + '</h2><p>' + photos.length + ' 张珍贵回忆</p>';
                photoWall.appendChild(separator);
                
                photos.forEach(function(photo, index) {
                    const photoItem = document.createElement('div');
                    photoItem.className = 'photo-item';
                    photoItem.innerHTML = '<img src="' + photo.path + '" alt="' + photo.name + '" loading="lazy"><div class="photo-theme">' + photo.icon + ' ' + photo.name + '</div>';
                    photoItem.onclick = function() { openViewer(theme, index); };
                    photoWall.appendChild(photoItem);
                });
            });
        }
        
        function filterByTheme(theme) {
            document.querySelectorAll('.theme-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.theme === theme);
            });
            
            const photoWall = document.getElementById('photoWall');
            
            if (currentTheme === theme || theme === null) {
                showAllPhotos();
                currentTheme = null;
            } else {
                photoWall.innerHTML = '';
                currentTheme = theme;
                const photos = PHOTOS_BY_THEME[theme];
                
                photos.forEach(function(photo, index) {
                    const photoItem = document.createElement('div');
                    photoItem.className = 'photo-item';
                    photoItem.innerHTML = '<img src="' + photo.path + '" alt="' + photo.name + '" loading="lazy"><div class="photo-theme">' + photo.icon + ' ' + photo.name + '</div>';
                    photoItem.onclick = function() { openViewer(theme, index); };
                    photoWall.appendChild(photoItem);
                });
            }
        }
        
        function openViewer(theme, index) {
            const viewer = document.getElementById('viewer');
            const viewerImg = document.getElementById('viewerImg');
            const viewerInfo = document.getElementById('viewerInfo');
            
            currentTheme = theme;
            currentPhotoIndex = index;
            
            const photo = PHOTOS_BY_THEME[theme][index];
            viewerImg.src = photo.path;
            viewerInfo.textContent = photo.icon + ' ' + photo.name;
            
            viewer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        
        function closeViewer() {
            const viewer = document.getElementById('viewer');
            viewer.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        
        function navigateViewer(direction) {
            const photos = PHOTOS_BY_THEME[currentTheme];
            currentPhotoIndex += direction;
            
            if (currentPhotoIndex < 0) currentPhotoIndex = photos.length - 1;
            if (currentPhotoIndex >= photos.length) currentPhotoIndex = 0;
            
            const photo = photos[currentPhotoIndex];
            document.getElementById('viewerImg').src = photo.path;
            document.getElementById('viewerInfo').textContent = photo.icon + ' ' + photo.name;
        }
        
        function enterAlbum() {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            init();
        }
        
        document.addEventListener('keydown', function(e) {
            const viewer = document.getElementById('viewer');
            if (viewer.style.display === 'flex') {
                if (e.key === 'ArrowLeft') navigateViewer(-1);
                if (e.key === 'ArrowRight') navigateViewer(1);
                if (e.key === 'Escape') closeViewer();
            }
        });
        
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.getElementById('viewer').addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        document.getElementById('viewer').addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) navigateViewer(1);
            if (touchEndX - touchStartX > 50) navigateViewer(-1);
        });
    </script>
